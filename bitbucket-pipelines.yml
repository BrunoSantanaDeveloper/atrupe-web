image: node:20

pipelines:
  branches:
    dev:
      - step:
          name: Wait for Backend Health & Run E2E Tests (Playwright -> Homolog)
          caches:
            - node
          script:
            # 1. Instalação de pacotes
            - npm ci
            
            # 2. Aguarda até 120s pelo backend de homolog estar respondendo
            - |
              for i in $(seq 1 24); do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${BACKEND_HOMOLOG_URL:-https://dev.atrupe.com.br}/health || echo "000")
                if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
                  echo "Backend homolog OK (HTTP $STATUS)"
                  break
                fi
                echo "Aguardando backend... (tentativa $i/24, HTTP $STATUS)"
                sleep 5
                if [ $i -eq 24 ]; then
                  echo "TIMEOUT: Backend de homolog não respondeu em 120s"
                  exit 1
                fi
              done
            
            # 3. Instala os navegadores do Playwright e dependências do SO
            - npx playwright install chromium --with-deps
            
            # 4. Roda os testes E2E diretamente contra o ambiente de homolog (dev.atrupe.com.br front)
            - E2E_BASE_URL=${E2E_HOMOLOG_URL:-https://dev.atrupe.com.br} npx playwright test --reporter=github
          
          # Salva os relatórios caso o teste falhe para debug visual
          artifacts:
            - playwright-report/**
            - test-results/**
