name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  # A fronteira do mock barra o deploy (plano 8.4): o build sem a flag não
  # pode mostrar tela, dado nem ação de exemplo. Roda inteiro no runner, sem
  # depender de homolog (fronteira.yml).
  fronteira:
    uses: ./.github/workflows/fronteira.yml

  deploy:
    needs: fronteira
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Versão fixa: a que fez o último deploy verde de produção. Trocar
      # quando for o caso, de propósito, e não a cada execução
      - name: Install Vercel CLI
        run: npm install --global vercel@63.1.0

      - name: Pull Vercel Project Info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # As telas em implantação rodam sobre dados de exemplo e só existem em
      # homolog (ver "Telas em implantação" no README). O build de produção não
      # pode sair com a flag de demonstração nem com as marcas de revisão: se
      # alguma estiver ligada no ambiente Production da Vercel, o deploy para.
      - name: Recusar a flag de demonstração em produção
        run: |
          if [ "${NEXT_PUBLIC_DEMO_DATA:-}" = "on" ] || [ "${NEXT_PUBLIC_REVIEW_MARKS:-}" = "on" ] ||
            grep -Eqs '^NEXT_PUBLIC_(DEMO_DATA|REVIEW_MARKS)="?on"?[[:space:]]*$' .vercel/.env.production.local; then
            echo "::error::NEXT_PUBLIC_DEMO_DATA e NEXT_PUBLIC_REVIEW_MARKS não podem estar ligadas em produção. Apague as duas do ambiente Production da Vercel."
            exit 1
          fi

      # As duas flags vão desligadas para o build, que as embute
      # (next.config.mjs): o servidor de produção não as lê do ambiente
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_DEMO_DATA: 'off'
          NEXT_PUBLIC_REVIEW_MARKS: 'off'

      - name: A flag ficou embutida no build
        run: |
          if grep -rlF --exclude='*.map' "process.env.NEXT_PUBLIC_DEMO_DATA" .vercel/output; then
            echo "::error::O build ainda lê NEXT_PUBLIC_DEMO_DATA em tempo de execução nos arquivos acima."
            exit 1
          fi

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
