name: Playwright E2E Tests

on:
  push:
    branches:
      - dev

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      
      - name: Wait for Backend Health
        env:
          BACKEND_HOMOLOG_URL: ${{ secrets.BACKEND_HOMOLOG_URL }}
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${BACKEND_HOMOLOG_URL:-https://dev.atrupe.com.br}/ || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Backend homolog OK (HTTP $STATUS)"
              break
            fi
            echo "Aguardando backend... (tentativa $i/24, HTTP $STATUS)"
            sleep 5
            if [ $i -eq 24 ]; then
              echo "TIMEOUT: Backend de homolog não respondeu em 120s"
              exit 1
            fi
          done

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        env:
          E2E_HOMOLOG_URL: ${{ secrets.E2E_HOMOLOG_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: E2E_BASE_URL=${E2E_HOMOLOG_URL:-https://homolog.atrupe.com.br} npx playwright test --reporter=github

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 15
