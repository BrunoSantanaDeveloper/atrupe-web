name: Playwright E2E Tests

on:
  push:
    branches:
      - dev

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      # O push em dev dispara este workflow e o deploy-homolog.yml ao mesmo
      # tempo: sem esperar, os testes pegavam a versão anterior de homolog.
      # Espera o deploy deste mesmo commit terminar; se ele falhou, para aqui.
      - name: Esperar o deploy de homolog deste commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-homolog.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            case "$RUN" in
              "completed success")
                echo "Deploy de homolog concluído"
                # A URL do deploy deste commit, registrada no ambiente
                # "homolog": o alias estável da Vercel pode ficar parado num
                # deploy antigo (em 20/10/2026 servia um build de antes de 23/09)
                DEPLOY_ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=homolog" --jq '.[0].id' 2>/dev/null || true)
                if [ -n "$DEPLOY_ID" ]; then
                  URL=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOY_ID/statuses" --jq '[.[] | select(.environment_url != null and .environment_url != "")][0].environment_url' 2>/dev/null || true)
                  if [ -n "$URL" ]; then
                    echo "Homolog deste commit: $URL"
                    echo "E2E_DEPLOY_URL=$URL" >> "$GITHUB_ENV"
                  fi
                fi
                exit 0
                ;;
              completed*)
                echo "::error::O deploy de homolog deste commit terminou com: $RUN"
                exit 1
                ;;
            esac
            echo "Aguardando o deploy de homolog... ($i/60: ${RUN:-ainda não começou})"
            sleep 15
          done
          echo "::error::O deploy de homolog deste commit não terminou em 15 minutos"
          exit 1

      - name: Wait for Backend Health
        env:
          BACKEND_HOMOLOG_URL: ${{ secrets.BACKEND_HOMOLOG_URL }}
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${BACKEND_HOMOLOG_URL:-https://dev.atrupe.com.br}/ || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Backend homolog OK (HTTP $STATUS)"
              break
            fi
            echo "Aguardando backend... (tentativa $i/24, HTTP $STATUS)"
            sleep 5
            if [ $i -eq 24 ]; then
              echo "TIMEOUT: Backend de homolog não respondeu em 120s"
              exit 1
            fi
          done

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      # Alvo: homolog, publicado COM a flag de demonstração (deploy-homolog.yml).
      # - NEXT_PUBLIC_DEMO_DATA declara a flag do alvo. A suíte @fronteira só
      #   roda pela config dela, no job abaixo (fronteira.yml).
      # - @captura só grava imagens, sem asserção: fica fora da CI.
      # - @mock são os specs das telas em implantação. Entram com a conta
      #   padrão (E2E_USER_*), que precisa ter as chaves até o FULL. Enquanto
      #   essa conta não existir, ficam de fora; para incluir, crie a variável
      #   de repositório E2E_INCLUDE_MOCK=true.
      # - E2E_<PLANO>_*: contas por plano das paredes e dos portões. São
      #   opcionais: sem o segredo, os testes daquele plano são pulados.
      - name: Run Playwright tests
        env:
          E2E_HOMOLOG_URL: ${{ secrets.E2E_HOMOLOG_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_TRIAL_EMAIL: ${{ secrets.E2E_TRIAL_EMAIL }}
          E2E_TRIAL_PASSWORD: ${{ secrets.E2E_TRIAL_PASSWORD }}
          E2E_START_EMAIL: ${{ secrets.E2E_START_EMAIL }}
          E2E_START_PASSWORD: ${{ secrets.E2E_START_PASSWORD }}
          E2E_LITE_EMAIL: ${{ secrets.E2E_LITE_EMAIL }}
          E2E_LITE_PASSWORD: ${{ secrets.E2E_LITE_PASSWORD }}
          E2E_PRO_EMAIL: ${{ secrets.E2E_PRO_EMAIL }}
          E2E_PRO_PASSWORD: ${{ secrets.E2E_PRO_PASSWORD }}
          E2E_ELITE_EMAIL: ${{ secrets.E2E_ELITE_EMAIL }}
          E2E_ELITE_PASSWORD: ${{ secrets.E2E_ELITE_PASSWORD }}
          E2E_FULL_EMAIL: ${{ secrets.E2E_FULL_EMAIL }}
          E2E_FULL_PASSWORD: ${{ secrets.E2E_FULL_PASSWORD }}
          NEXT_PUBLIC_DEMO_DATA: 'on'
          E2E_INCLUDE_MOCK: ${{ vars.E2E_INCLUDE_MOCK }}
        run: |
          EXCLUIR='@mock|@captura'
          if [ "$E2E_INCLUDE_MOCK" = "true" ]; then EXCLUIR='@captura'; fi
          E2E_BASE_URL=${E2E_DEPLOY_URL:-${E2E_HOMOLOG_URL:-https://app-web-atrupe-dev-admin-atrupes-projects.vercel.app}} npx playwright test --reporter=github --grep-invert "$EXCLUIR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 15

  # Fronteira do mock: o build sem a flag, no próprio runner, com API de
  # mentira e sessão de teste; não depende de homolog (fronteira.yml)
  fronteira:
    uses: ./.github/workflows/fronteira.yml
