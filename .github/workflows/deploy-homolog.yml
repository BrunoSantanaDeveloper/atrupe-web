name: Deploy Homolog to Vercel

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      demonstracao:
        description: 'Telas em implantação (dados de exemplo). Desligue para a rodada de regressão das telas reais antes de um trem para produção.'
        type: boolean
        default: true

# Dois pushes seguidos na dev disputavam o deploy: o do commit anterior podia
# terminar depois e ficar como o mais recente (20/10/2026). O push novo
# cancela o deploy que ainda está rodando.
concurrency:
  group: deploy-homolog
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cada deploy fica registrado no ambiente "homolog" do GitHub com a URL
    # dele: o link do último homolog aparece no repositório (Deployments) e o
    # e2e testa exatamente o deploy do commit que ele está testando
    environment:
      name: homolog
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Versão fixa, a mesma do deploy de produção
      # O Node do build é o do runtime (engines.node = 22.x no package.json):
      # o Node 20 sai de suporte (segurança de outubro de 2026)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install Vercel CLI
        run: npm install --global vercel@63.1.0

      - name: Pull Vercel Project Info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Telas em implantação (dados de exemplo) e marcas de revisão: só em
      # homolog. São variáveis de build do Next, declaradas aqui para ficarem
      # versionadas; o deploy.yml de produção recusa o build se encontrar
      # alguma delas ligada. Ver "Telas em implantação" no README. Rodado à
      # mão com "demonstracao" desligado, homolog sobe sem elas, como produção.
      #
      # A API do homolog: o ambiente Preview do projeto na Vercel apontava
      # para outro backend (o login e as telas do homolog não chegavam à API
      # do homolog). O deploy fixa a API_URL no build (no arquivo que o
      # 'vercel pull' baixou) e na execução (--env no deploy). A variável de
      # repositório HOMOLOG_API_URL troca o endereço sem mexer aqui.
      - name: Build Project Artifacts
        run: |
          sed -i '/^API_URL=/d' .vercel/.env.preview.local
          echo "API_URL=\"$HOMOLOG_API_URL\"" >> .vercel/.env.preview.local
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          HOMOLOG_API_URL: ${{ vars.HOMOLOG_API_URL || 'https://dev.atrupe.com.br' }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_DEMO_DATA: ${{ github.event_name == 'workflow_dispatch' && !inputs.demonstracao && 'off' || 'on' }}
          NEXT_PUBLIC_REVIEW_MARKS: ${{ github.event_name == 'workflow_dispatch' && !inputs.demonstracao && 'off' || 'on' }}

      # O homolog não tem domínio próprio: é a URL estável da Vercel do autor
      # do token (app-web-atrupe-dev-admin-atrupes-projects.vercel.app), que
      # aponta sempre para o deploy mais recente. Sem integração git nem
      # `vercel alias set` (decisão de 20/07/2026).
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --env API_URL="$HOMOLOG_API_URL" --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployment: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Homolog deste commit: $URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HOMOLOG_API_URL: ${{ vars.HOMOLOG_API_URL || 'https://dev.atrupe.com.br' }}
