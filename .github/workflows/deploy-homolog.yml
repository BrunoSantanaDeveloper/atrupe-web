name: Deploy Homolog to Vercel

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      demonstracao:
        description: 'Telas em implantação (dados de exemplo). Desligue para a rodada de regressão das telas reais antes de um trem para produção.'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Versão fixa, a mesma do deploy de produção
      - name: Install Vercel CLI
        run: npm install --global vercel@63.1.0

      - name: Pull Vercel Project Info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Telas em implantação (dados de exemplo) e marcas de revisão: só em
      # homolog. São variáveis de build do Next, declaradas aqui para ficarem
      # versionadas; o deploy.yml de produção recusa o build se encontrar
      # alguma delas ligada. Ver "Telas em implantação" no README. Rodado à
      # mão com "demonstracao" desligado, homolog sobe sem elas, como produção.
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_DEMO_DATA: ${{ github.event_name == 'workflow_dispatch' && !inputs.demonstracao && 'off' || 'on' }}
          NEXT_PUBLIC_REVIEW_MARKS: ${{ github.event_name == 'workflow_dispatch' && !inputs.demonstracao && 'off' || 'on' }}

      # O deployment carrega o metadado de branch (dev), então a Vercel atribui
      # homolog.atrupe.com.br automaticamente por ser branch domain da dev.
      # Não usar `vercel alias set`: domínios ligados a um ambiente recusam
      # atribuição manual ("You don't have access to the domain").
      - name: Deploy Project Artifacts to Vercel
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployment: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
